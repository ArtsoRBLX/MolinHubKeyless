name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Molin Hub Updater Notifer"
          avatar_url: "https://raw.githubusercontent.com/ArtsoRBLX/MolinHubKeyless/refs/heads/main/molinhub-logo.png"
          content: "@Script Update Ping A new update has dropped check it out"
          footer_title: "Changelog"
          reduce_headings: true
